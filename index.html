<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 발주 계산기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #F5F6FA; color: #1F2937; }

  .header { background: #1E3A5F; color: white; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header span { font-size: 12px; color: #93C5FD; }

  .container { max-width: 860px; margin: 0 auto; padding: 20px; }

  /* 홈 화면 */
  .home { display: flex; flex-direction: column; align-items: center; padding: 60px 20px; }
  .home h2 { font-size: 20px; font-weight: 700; margin-bottom: 40px; color: #1F2937; }
  .home-btns { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .home-btn { width: 220px; height: 160px; border: none; border-radius: 16px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; line-height: 1.5; transition: opacity 0.15s; }
  .home-btn:hover { opacity: 0.88; }
  .home-btn.reorder { background: #059669; }
  .home-btn.new { background: #2563EB; }
  .home-btn .icon { font-size: 32px; }
  .home-btn .sub { font-size: 12px; font-weight: 400; opacity: 0.85; }

  /* 패널 공통 */
  .panel { display: none; }
  .panel.active { display: block; }

  .back-btn { background: #1E3A5F; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer; color: white; margin-bottom: 10px; font-family: inherit; transition: opacity 0.15s; }
  .back-btn:hover { opacity: 0.85; }

  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 12px; }

  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  label { font-size: 11px; font-weight: 700; color: #1F2937; white-space: nowrap; }
  input[type=text], input[type=number] {
    border: 1px solid #D1D5DB; border-radius: 8px; padding: 8px 12px;
    font-size: 13px; font-family: inherit; background: #F9FAFB; color: #1F2937;
    outline: none;
  }
  input[type=text]:focus, input[type=number]:focus { border-color: #2563EB; }
  input.product-input { width: 280px; }
  input.bonip-input { width: 70px; }

  .section-label { font-size: 11px; font-weight: 700; margin-bottom: 6px; }
  .section-label.green { color: #059669; }
  .section-label.blue { color: #2563EB; }

  .paste-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
  textarea {
    width: 100%; border: 1px solid #D1D5DB; border-radius: 8px; padding: 10px;
    font-size: 12px; font-family: inherit; background: #F9FAFB; color: #1F2937;
    resize: vertical; outline: none; height: 100px;
  }
  textarea.green-border { border-color: #059669; }
  textarea.blue-border { border-color: #2563EB; }
  textarea:focus { border-color: #2563EB; }

  .btn { border: none; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; color: white; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn.blue { background: #2563EB; }
  .btn.green { background: #059669; }
  .btn.gray { background: #9CA3AF; }
  .btn.purple { background: #6D28D9; }
  .btn.calc { height: 42px; padding: 0 24px; font-size: 14px; }

  .action-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .status { font-size: 11px; color: #6B7280; }
  .status.success { color: #059669; }
  .status.warn { color: #D97706; }

  /* 테이블 */
  .result-card { background: white; border-radius: 12px; padding: 16px; margin-top: 12px; }
  .info-bar { background: #EEF2FF; border-radius: 6px; padding: 10px 14px; font-size: 12px; font-weight: 700; color: #1E3A5F; margin-bottom: 8px; }

  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #1E3A5F; }
  thead th { color: white; font-size: 12px; font-weight: 700; padding: 10px 8px; text-align: center; }
  tbody tr:nth-child(odd) { background: #FFFFFF; }
  tbody tr:nth-child(even) { background: #EFF4FF; }
  tbody td { font-size: 12px; padding: 9px 8px; text-align: center; border-right: 0.5px solid #E5E7EB; }
  tbody td:last-child { border-right: none; }
  tbody td.dispatch { color: #2563EB; font-weight: 700; cursor: pointer; }
  tbody td.dispatch:hover { background: #DBEAFE; }
  tfoot tr { background: #DBEAFE; }
  tfoot td { font-size: 12px; font-weight: 700; padding: 10px 8px; text-align: center; color: #1E3A5F; }

  .bottom-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

  .edit-input { width: 70px; text-align: center; border: 1px solid #2563EB; border-radius: 4px; padding: 2px 4px; font-size: 12px; font-family: inherit; }

  @media (max-width: 600px) {
    input.product-input { width: 200px; }
    .home-btns { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📦 상품 발주 계산기</h1>
  <span>v4</span>
</div>

<div class="container">
  <!-- 홈 -->
  <div id="home" class="home">
    <h2>어떤 발주를 계산할까요?</h2>
    <div class="home-btns">
      <button class="home-btn reorder" onclick="showPanel('reorder')">
        <span class="icon">🔄</span>
        <span>재주문 상품</span>
        <span class="sub">잔여 재고 + 앵콜 주문 계산</span>
      </button>
      <button class="home-btn new" onclick="showPanel('new')">
        <span class="icon">✨</span>
        <span>신규 상품</span>
        <span class="sub">주문 가능 개수 기준 계산</span>
      </button>
    </div>
  </div>

  <!-- 신규 상품 패널 -->
  <div id="new-panel" class="panel">
    <button class="back-btn" onclick="showHome()">← 홈으로</button>

    <div class="card">
      <div class="row">
        <label>상품명</label>
        <input type="text" id="new-product" class="product-input" placeholder="예: 참이슬 후레쉬 360ml">
        <label>본입</label>
        <input type="number" id="new-bonip" class="bonip-input" placeholder="예: 6" min="1">
        <span style="font-size:12px;color:#6B7280;">본</span>
      </div>

      <div class="section-label blue">도매사 데이터</div>
      <div class="paste-row">
        <button class="btn blue" onclick="pasteText('new-text')">📋 붙여넣기</button>
        <button class="btn gray" onclick="clearText('new-text')">🗑 지우기</button>
      </div>
      <textarea id="new-text" placeholder="도매사 데이터를 붙여넣어 주세요.&#10;예) * 경포주류(0) - 상태: 판매 중 | 주문 가능 개수 : -4 | ..."></textarea>

      <div class="action-row">
        <span id="new-status" class="status"></span>
        <button class="btn blue calc" onclick="calcNew()">⚡ 계산하기</button>
      </div>
    </div>

    <div id="new-result"></div>
  </div>

  <!-- 재주문 상품 패널 -->
  <div id="reorder-panel" class="panel">
    <button class="back-btn" onclick="showHome()">← 홈으로</button>

    <div class="card">
      <div class="row">
        <label>상품명</label>
        <input type="text" id="re-product" class="product-input" placeholder="예: 타이페이 고량주 300ml">
        <label>본입</label>
        <input type="number" id="re-bonip" class="bonip-input" placeholder="예: 12" min="1">
        <span style="font-size:12px;color:#6B7280;">본</span>
      </div>

      <div class="section-label green">1번 프로덕트 (잔여 재고)</div>
      <div class="paste-row">
        <button class="btn green" onclick="pasteText('re-stock')">📋 붙여넣기</button>
        <button class="btn gray" onclick="clearText('re-stock')">🗑 지우기</button>
      </div>
      <textarea id="re-stock" class="green-border" placeholder="1번 프로덕트 데이터를 붙여넣어 주세요.&#10;예) * 경포주류(0) - 상태: 판매 중 | 주문 가능 개수 : 10 | ..."></textarea>

      <div class="section-label blue" style="margin-top:12px;">2번 프로덕트 (앵콜 주문)</div>
      <div class="paste-row">
        <button class="btn blue" onclick="pasteText('re-demand')">📋 붙여넣기</button>
        <button class="btn gray" onclick="clearText('re-demand')">🗑 지우기</button>
      </div>
      <textarea id="re-demand" class="blue-border" placeholder="2번 프로덕트 데이터를 붙여넣어 주세요.&#10;예) * 경포주류(0) - 상태: 판매 중 | 주문 가능 개수 : -4 | ..."></textarea>

      <div class="action-row">
        <span id="re-status" class="status"></span>
        <button class="btn blue calc" onclick="calcReorder()">⚡ 계산하기</button>
      </div>
    </div>

    <div id="re-result"></div>
  </div>
</div>

<script>
function showHome() {
  document.getElementById('home').style.display = 'flex';
  document.getElementById('new-panel').classList.remove('active');
  document.getElementById('reorder-panel').classList.remove('active');
}
function showPanel(type) {
  document.getElementById('home').style.display = 'none';
  document.getElementById('new-panel').classList.remove('active');
  document.getElementById('reorder-panel').classList.remove('active');
  document.getElementById(type + '-panel').classList.add('active');
}

async function pasteText(id) {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById(id).value = text;
  } catch(e) {
    alert('붙여넣기 권한이 필요합니다.\n직접 Ctrl+V(또는 Cmd+V)로 붙여넣어 주세요.');
  }
}
function clearText(id) {
  document.getElementById(id).value = '';
}

function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status ' + (type || '');
}

// 신규 상품 파싱
function parseNew(text, bonip) {
  const results = [];
  for (const line of text.split('\n')) {
    const l = line.trim().replace(/^\*\s*/, '');
    if (!l) continue;
    const nameMatch = l.match(/^([^\(\n]+?)\s*\(/);
    if (!nameMatch) continue;
    const seller = nameMatch[1].trim();
    const qtyMatch = l.match(/주문\s*가능\s*개수\s*:\s*(-?\d+)/);
    if (!qtyMatch) continue;
    const qty = parseInt(qtyMatch[1]);
    if (qty < 0) {
      const orderQty = Math.abs(qty);
      const dispatchQty = Math.ceil(orderQty / bonip) * bonip;
      results.push({ seller, orderQty, dispatchQty });
    } else {
      results.push({ seller, orderQty: null, dispatchQty: null });
    }
  }
  return results;
}

// 재주문 파싱
function parseStock(text) {
  const map = {};
  for (const line of text.split('\n')) {
    const l = line.trim().replace(/^\*\s*/, '');
    if (!l) continue;
    const nameMatch = l.match(/^([^\(\n]+?)\s*\(/);
    if (!nameMatch) continue;
    const seller = nameMatch[1].trim();
    const qtyMatch = l.match(/주문\s*가능\s*개수\s*:\s*(-?\d+)/);
    if (!qtyMatch) continue;
    const qty = parseInt(qtyMatch[1]);
    map[seller] = Math.max(0, qty);
  }
  return map;
}
function parseDemand(text) {
  const map = {};
  for (const line of text.split('\n')) {
    const l = line.trim().replace(/^\*\s*/, '');
    if (!l) continue;
    const nameMatch = l.match(/^([^\(\n]+?)\s*\(/);
    if (!nameMatch) continue;
    const seller = nameMatch[1].trim();
    const qtyMatch = l.match(/주문\s*가능\s*개수\s*:\s*(-?\d+)/);
    if (!qtyMatch) continue;
    const qty = parseInt(qtyMatch[1]);
    map[seller] = qty < 0 ? Math.abs(qty) : 0;
  }
  return map;
}
function calcReorderData(stockMap, demandMap, bonip) {
  const sellers = [...new Set([...Object.keys(stockMap), ...Object.keys(demandMap)])].sort();
  return sellers.map(seller => {
    const stock  = stockMap[seller]  || 0;
    const demand = demandMap[seller] || 0;
    const net = stock - demand;
    const dispatch = net < 0 ? Math.ceil(Math.abs(net) / bonip) * bonip : null;
    return {
      seller,
      stock:  stock  > 0 ? stock  : null,
      demand: demand > 0 ? demand : null,
      dispatch,
    };
  });
}

// 신규 계산
let newData = [];
function calcNew() {
  const product  = document.getElementById('new-product').value.trim();
  const bonipStr = document.getElementById('new-bonip').value.trim();
  const raw      = document.getElementById('new-text').value;
  if (!product)          { setStatus('new-status','⚠ 상품명을 입력해 주세요.','warn'); return; }
  if (!bonipStr || bonipStr < 1) { setStatus('new-status','⚠ 본입을 입력해 주세요.','warn'); return; }
  if (!raw.trim())       { setStatus('new-status','⚠ 데이터를 입력해 주세요.','warn'); return; }
  const bonip = parseInt(bonipStr);
  newData = parseNew(raw, bonip);
  if (!newData.length)   { setStatus('new-status','⚠ 파싱된 데이터가 없습니다.','warn'); return; }
  setStatus('new-status', `✔ ${newData.length}개 도매사 파싱 완료`, 'success');
  renderNewTable(product, bonip);
}

function renderNewTable(product, bonip) {
  const container = document.getElementById('new-result');
  let rows = newData.map((d, i) => `
    <tr>
      <td>${d.seller}</td>
      <td>${d.orderQty != null ? d.orderQty : ''}</td>
      <td class="dispatch" ondblclick="startEdit(this, 'new', ${i})" title="더블클릭하여 수정">
        <span id="new-dispatch-${i}">${d.dispatchQty != null ? d.dispatchQty : ''}</span>
      </td>
    </tr>`).join('');

  const totalOrder    = newData.reduce((s, d) => s + (d.orderQty || 0), 0);
  const totalDispatch = newData.reduce((s, d) => s + (d.dispatchQty || 0), 0);

  container.innerHTML = `
    <div class="result-card">
      <div class="info-bar">상품명: ${product} &nbsp;|&nbsp; ${bonip}본입</div>
      <table>
        <thead><tr><th>도매사명</th><th>주문 수량</th><th>발주 수량</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>합 계</td><td>${totalOrder}</td><td id="new-total-dispatch">${totalDispatch}</td></tr></tfoot>
      </table>
      <div class="bottom-btns">
        <button class="btn purple" onclick="exportImage('new', '${product}', ${bonip})">🖼 이미지 추출</button>
        <button class="btn green" onclick="exportExcel('new', '${product}')">💾 저장하기</button>
      </div>
    </div>`;
}

// 재주문 계산
let reData = [];
function calcReorder() {
  const product  = document.getElementById('re-product').value.trim();
  const bonipStr = document.getElementById('re-bonip').value.trim();
  const rawStock  = document.getElementById('re-stock').value;
  const rawDemand = document.getElementById('re-demand').value;
  if (!product)          { setStatus('re-status','⚠ 상품명을 입력해 주세요.','warn'); return; }
  if (!bonipStr || bonipStr < 1) { setStatus('re-status','⚠ 본입을 입력해 주세요.','warn'); return; }
  const bonip = parseInt(bonipStr);
  const stockMap  = parseStock(rawStock);
  const demandMap = parseDemand(rawDemand);
  if (!Object.keys(stockMap).length && !Object.keys(demandMap).length) {
    setStatus('re-status','⚠ 파싱된 데이터가 없습니다.','warn'); return;
  }
  reData = calcReorderData(stockMap, demandMap, bonip);
  setStatus('re-status', `✔ ${reData.length}개 도매사 계산 완료`, 'success');
  renderReTable(product, bonip);
}

function renderReTable(product, bonip) {
  const container = document.getElementById('re-result');
  let rows = reData.map((d, i) => `
    <tr>
      <td>${d.seller}</td>
      <td>${d.stock  != null ? d.stock  : ''}</td>
      <td>${d.demand != null ? d.demand : ''}</td>
      <td class="dispatch" ondblclick="startEdit(this, 're', ${i})" title="더블클릭하여 수정">
        <span id="re-dispatch-${i}">${d.dispatch != null ? d.dispatch : ''}</span>
      </td>
    </tr>`).join('');

  const totalStock    = reData.reduce((s, d) => s + (d.stock   || 0), 0);
  const totalDemand   = reData.reduce((s, d) => s + (d.demand  || 0), 0);
  const totalDispatch = reData.reduce((s, d) => s + (d.dispatch|| 0), 0);

  container.innerHTML = `
    <div class="result-card">
      <div class="info-bar">상품명: ${product} &nbsp;|&nbsp; ${bonip}본입</div>
      <table>
        <thead><tr><th>도매사명</th><th>잔여 수량</th><th>앵콜 주문</th><th>추가 발주</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>합 계</td><td>${totalStock}</td><td>${totalDemand}</td><td id="re-total-dispatch">${totalDispatch}</td></tr></tfoot>
      </table>
      <div class="bottom-btns">
        <button class="btn purple" onclick="exportImage('re', '${product}', ${bonip})">🖼 이미지 추출</button>
        <button class="btn green" onclick="exportExcel('re', '${product}')">💾 저장하기</button>
      </div>
    </div>`;
}

// 셀 편집
function startEdit(td, mode, idx) {
  const span = td.querySelector('span');
  const cur  = span.textContent;
  const input = document.createElement('input');
  input.type = 'number'; input.className = 'edit-input'; input.value = cur; input.min = '0';
  td.innerHTML = ''; td.appendChild(input); input.focus(); input.select();

  function commit() {
    const val = Math.max(0, parseInt(input.value) || 0);
    if (mode === 'new') {
      newData[idx].dispatchQty = val || null;
      span.textContent = val || '';
    } else {
      reData[idx].dispatch = val || null;
      span.textContent = val || '';
    }
    td.innerHTML = ''; td.appendChild(span);
    updateTotal(mode);
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { td.innerHTML = ''; td.appendChild(span); } });
}

function updateTotal(mode) {
  if (mode === 'new') {
    const total = newData.reduce((s, d) => s + (d.dispatchQty || 0), 0);
    const el = document.getElementById('new-total-dispatch');
    if (el) el.textContent = total;
  } else {
    const total = reData.reduce((s, d) => s + (d.dispatch || 0), 0);
    const el = document.getElementById('re-total-dispatch');
    if (el) el.textContent = total;
  }
}

// 엑셀(CSV) 저장
function exportExcel(mode, product) {
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
  let csv, fname;
  if (mode === 'new') {
    csv = '도매사명,주문수량,발주수량\n';
    newData.forEach(d => csv += `${d.seller},${d.orderQty||''},${d.dispatchQty||''}\n`);
    const to = newData.reduce((s,d)=>s+(d.orderQty||0),0);
    const td = newData.reduce((s,d)=>s+(d.dispatchQty||0),0);
    csv += `합계,${to},${td}\n`;
    fname = `${today}_신규_${product}.csv`;
  } else {
    csv = '도매사명,잔여수량,앵콜주문,추가발주\n';
    reData.forEach(d => csv += `${d.seller},${d.stock||''},${d.demand||''},${d.dispatch||''}\n`);
    const ts = reData.reduce((s,d)=>s+(d.stock||0),0);
    const td2 = reData.reduce((s,d)=>s+(d.demand||0),0);
    const td3 = reData.reduce((s,d)=>s+(d.dispatch||0),0);
    csv += `합계,${ts},${td2},${td3}\n`;
    fname = `${today}_재주문_${product}.csv`;
  }
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = fname; a.click();
}

// 이미지 추출
function exportImage(mode, product, bonip) {
  const canvas = document.createElement('canvas');
  const isNew  = mode === 'new';
  const data   = isNew ? newData : reData;
  const cols   = isNew ? ['도매사명','주문 수량','발주 수량'] : ['도매사명','잔여 수량','앵콜 주문','추가 발주'];
  const cw     = isNew ? [260,160,160] : [200,130,130,130];
  const rowH   = 38; const padX = 16;
  const totalW = cw.reduce((a,b)=>a+b,0) + padX*2;
  const totalH = rowH*(1+1+data.length+1)+60;
  canvas.width = totalW; canvas.height = totalH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,totalW,totalH);

  function drawText(text, x, y, font, color, maxW) {
    ctx.font = font; ctx.fillStyle = color; ctx.fillText(text, x, y, maxW);
  }
  function centeredText(text, x, colW, y, font, color) {
    ctx.font = font; ctx.fillStyle = color;
    const tw = ctx.measureText(text).width;
    ctx.fillText(text, x + (colW - tw)/2, y);
  }

  let y = 20;
  // 정보 행
  ctx.fillStyle='#EEF2FF'; ctx.fillRect(padX,y,totalW-padX*2,rowH+6);
  drawText(`상품명: ${product}  |  ${bonip}본입`, padX+12, y+24, 'bold 16px sans-serif', '#1E3A5F');
  y += rowH+8;

  // 헤더
  ctx.fillStyle='#1E3A5F'; ctx.fillRect(padX,y,totalW-padX*2,rowH);
  let x=padX;
  cols.forEach((col,i)=>{ centeredText(col,x,cw[i],y+24,'bold 14px sans-serif','#FFFFFF'); x+=cw[i]; });
  y+=rowH+1;

  // 데이터 행
  data.forEach((d,ri)=>{
    ctx.fillStyle = ri%2===0?'#FFFFFF':'#EFF4FF';
    ctx.fillRect(padX,y,totalW-padX*2,rowH);
    const vals = isNew
      ? [d.seller, d.orderQty!=null?String(d.orderQty):'', d.dispatchQty!=null?String(d.dispatchQty):'']
      : [d.seller, d.stock!=null?String(d.stock):'', d.demand!=null?String(d.demand):'', d.dispatch!=null?String(d.dispatch):''];
    x=padX;
    vals.forEach((val,vi)=>{
      const isDispatch = isNew ? vi===2 : vi===3;
      centeredText(val,x,cw[vi],y+24, isDispatch?'bold 14px sans-serif':'13px sans-serif', isDispatch?'#2563EB':'#1F2937');
      x+=cw[vi];
    });
    // 구분선
    let sx=padX;
    cw.slice(0,-1).forEach(c=>{ sx+=c; ctx.strokeStyle='#CBD5E1'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(sx,y+6); ctx.lineTo(sx,y+rowH-6); ctx.stroke(); });
    y+=rowH+1;
  });

  // 합계
  ctx.fillStyle='#DBEAFE'; ctx.fillRect(padX,y,totalW-padX*2,rowH);
  const sumVals = isNew
    ? ['합  계', String(newData.reduce((s,d)=>s+(d.orderQty||0),0)), String(newData.reduce((s,d)=>s+(d.dispatchQty||0),0))]
    : ['합  계', String(reData.reduce((s,d)=>s+(d.stock||0),0)), String(reData.reduce((s,d)=>s+(d.demand||0),0)), String(reData.reduce((s,d)=>s+(d.dispatch||0),0))];
  x=padX;
  sumVals.forEach((val,i)=>{ centeredText(val,x,cw[i],y+24,'bold 14px sans-serif','#1E3A5F'); x+=cw[i]; });

  const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const fname = isNew ? `${today}_신규_${product}_발주표.png` : `${today}_재주문_${product}_발주표.png`;
  const a = document.createElement('a'); a.href = canvas.toDataURL('image/png');
  a.download = fname; a.click();
}
</script>
</body>
</html>
